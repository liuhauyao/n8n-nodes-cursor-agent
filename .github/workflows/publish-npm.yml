name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and lint
        run: npm run verify

      - name: Verify npm auth
        run: npm whoami || echo "::warning::npm whoami failed — check NPM_TOKEN secret (Automation token, publish permission)"
        continue-on-error: true

      - name: Publish if version not on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-cursor-agent@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already on npm, skip publish."
            exit 0
          fi
          # Provenance requires npm Trusted Publisher (GitHub repo linked). Fallback without it.
          if npm publish --provenance --access public; then
            echo "Published ${VERSION} with provenance."
          else
            echo "Provenance publish failed; retrying without --provenance..."
            npm publish --access public
          fi
